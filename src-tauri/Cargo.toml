[package]
name = "framefetch"
version = "0.1.0"
description = "FrameFetch — a considered home for your downloads"
edition = "2021"

[lib]
name = "framefetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
grammers-client = "0.10"
grammers-mtsender = { version = "0.10", features = ["proxy"] }
grammers-session = "0.10"
grammers-tl-types = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
# grammers 0.10 expects the rc0 BigUint/check API; rc1 changes both.
glass_pumpkin = "=2.0.0-rc0"

[profile.dev]
debug = 0
incremental = true

